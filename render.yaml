# Render Blueprint — deploys the backend as a Docker web service.
# Push this branch, then in Render: New > Blueprint > pick this repo.
# Secrets (marked sync: false) are entered once in the Render dashboard, never here.
services:
  - type: web
    name: finsights-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Monorepo: only rebuild/redeploy this service when a backend-affecting file actually
    # changed. Without this, every frontend-only PR merge to main still triggers a full
    # Docker/Maven rebuild here — the "unnecessary backend deployments" this exists to stop.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: APP_AUTH_MODE
        value: google
      - key: SPRING_PROFILES_ACTIVE
        value: google
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false   # Neon's pooled connection string, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false   # your Vercel domain, e.g. https://finsights.vercel.app
      - key: CORS_ORIGIN
        sync: false   # same as FRONTEND_URL
      - key: RESEND_API_KEY
        sync: false   # from resend.com — Render's free tier blocks outbound SMTP, so account-
                       # activation email goes through Resend's HTTP API instead of Gmail SMTP
      - key: KITE_API_KEY
        sync: false   # from the Kite Connect developer console — leave unset and broker-sync
                       # (issue #90) just stays disabled, same as RESEND_API_KEY blank
      - key: KITE_API_SECRET
        sync: false
      - key: KITE_REDIRECT_URL
        sync: false   # must exactly match the redirect URL registered in the Kite developer
                       # console, e.g. https://your-backend.onrender.com/api/brokers/kite/callback
      - key: BROKER_TOKEN_ENCRYPTION_KEY
        sync: false   # encrypts every stored Kite access/refresh token at rest — generate a long
                       # random value once (e.g. `openssl rand -base64 32`) and never rotate it
                       # without expecting every existing connection to need reconnecting
