# Render Blueprint — deploys the backend as a Docker web service.
# Push this branch, then in Render: New > Blueprint > pick this repo.
# Secrets (marked sync: false) are entered once in the Render dashboard, never here.
services:
  - type: web
    name: finsights-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: APP_AUTH_MODE
        value: google
      - key: SPRING_PROFILES_ACTIVE
        value: google
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false   # Neon's pooled connection string, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false   # your Vercel domain, e.g. https://finsights.vercel.app
      - key: CORS_ORIGIN
        sync: false   # same as FRONTEND_URL
      - key: GMAIL_USERNAME
        sync: false   # the Gmail address account-activation emails are sent from
      - key: GMAIL_APP_PASSWORD
        sync: false   # a 16-character Google Account App Password, not the account's login password
