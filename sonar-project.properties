# SonarCloud config — free while this repo stays public (see .github/workflows/ci.yml).
sonar.organization=ash4691-rgb
sonar.projectKey=ash4691-rgb

sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,backend/target/**

# Java coverage — points at the report jacoco-maven-plugin writes during `mvn test` (see
# backend/pom.xml). No TypeScript coverage tool is wired up yet; add one (e.g. vitest --coverage)
# and point sonar.javascript.lcov.reportPaths at it if you want frontend coverage numbers too.
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
