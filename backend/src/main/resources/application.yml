spring:
  application:
    name: finsights-portfolio-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/finsights;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      # Small pool, connections allowed to close when idle — a single small backend doesn't
      # need many, and on a serverless-billed Postgres (e.g. Neon) a connection held open
      # forever is a connection that never lets the database's compute suspend, which quietly
      # turns "pay only while active" into "pay always." Harmless against H2/dev too.
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      # Store enums as plain VARCHAR, not a native ENUM type, so adding an enum
      # constant later doesn't need a schema migration on an existing DB.
      hibernate.type.preferred_enum_jdbc_type: VARCHAR
  h2:
    console:
      enabled: true
      path: /h2-console
  # Gmail SMTP via an App Password — free, no extra service to sign up for. Blank
  # username/password (the default) is a valid, supported state: MailService checks for that
  # itself and logs the verification link instead of sending, so local dev/CI never needs real
  # credentials.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

app:
  auth-mode: ${APP_AUTH_MODE:demo}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  goku:
    enabled: ${GOKU_ENABLED:true}
    # Who can chat with Goku is database-backed (see GokuAllowlistService) and managed from the
    # admin panel, not config — seed-allowlist only ever runs once, to populate an empty table on
    # first boot. demo@finsights.local is seeded too — the default demo-auth filter signs every
    # local/undeployed request in as that account (see DemoAuthenticationFilter), so without it
    # Goku would be invisible out of the box even to the one real account this shipped for.
    seed-allowlist: ${GOKU_SEED_ALLOWLIST:ash4691@gmail.com,demo@finsights.local}
    # Who can manage that allowlist. Kept out of the database on purpose — granting admin access
    # is a higher-trust action than granting chat access, and a config change + redeploy is the
    # right amount of friction for it.
    admin-allowlist: ${GOKU_ADMIN_ALLOWLIST:ash4691@gmail.com}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${GOKU_MODEL:claude-haiku-4-5-20251001}
    daily-query-limit: ${GOKU_DAILY_QUERY_LIMIT:40}

---
# Google OAuth is only wired when the "google" profile is active, so the demo
# profile never trips Spring's "client-id must not be empty" validation.
# Run with: APP_AUTH_MODE=google SPRING_PROFILES_ACTIVE=google GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=...
spring:
  config:
    activate:
      on-profile: google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
  # The H2 console is a database admin UI — fine for local dev, never for a real deployment.
  # It's mounted (and left permitAll in SecurityConfig) purely so demo mode can inspect the
  # file-backed H2 database; production always runs this "google" profile, so disabling it here
  # means the route doesn't exist at all once real users' data is involved, regardless of which
  # database is actually configured.
  h2:
    console:
      enabled: false

# The frontend (Vercel) and this backend (Render) are on different domains, so this is a
# genuinely cross-site setup. Without SameSite=None, the browser only sends the session
# cookie back on same-site requests — a cross-site fetch() (every API call the SPA makes)
# never carries it, so login appears to "succeed" but every following request looks signed
# out. None requires Secure, which is fine since both sides are HTTPS in this profile.
server:
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

app:
  auth-mode: google
